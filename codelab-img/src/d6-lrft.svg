<text x="70" y="80" font-family="-apple-system,'SF Pro Text','Helvetica Neue',Arial" font-size="46" font-weight="800" fill="#2B2320">LongRunningFunctionTool</text><text x="70" y="120" font-family="-apple-system,'SF Pro Text','Helvetica Neue',Arial" font-size="24" fill="#8B7E70">the job goes OUT, the receipt comes BACK — in the same instant</text><rect x="90" y="260" width="220" height="110" rx="18" fill="#E9B44C" stroke="#E9B44C" stroke-width="3"/><text x="200.0" y="313.0" font-family="'SF Mono',Menlo,Consolas" font-size="26" font-weight="700" fill="#2B2320" text-anchor="middle">YOU</text><text x="200.0" y="341.0" font-family="-apple-system,'SF Pro Text','Helvetica Neue',Arial" font-size="17" fill="#F5EFE4" text-anchor="middle">"Draft a thumbnail: …"</text><circle cx="360" cy="315" r="26" fill="#2B2320"/><text x="360" y="324" font-family="'SF Mono',Menlo,Consolas" font-size="24" fill="#FFFFFF" text-anchor="middle" font-weight="700">1</text><path d="M310,315 L400,315" fill="none" stroke="#C9BCA9" stroke-width="4" marker-end="url(#a)"/><rect x="430" y="250" width="300" height="130" rx="18" fill="#8B7EC8" stroke="#8B7EC8" stroke-width="3"/><text x="580.0" y="313.0" font-family="'SF Mono',Menlo,Consolas" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">✦ render desk</text><text x="580.0" y="341.0" font-family="-apple-system,'SF Pro Text','Helvetica Neue',Arial" font-size="17" fill="#F5EFE4" text-anchor="middle">one agent, one tool</text><circle cx="790" cy="315" r="26" fill="#2B2320"/><text x="790" y="324" font-family="'SF Mono',Menlo,Consolas" font-size="24" fill="#FFFFFF" text-anchor="middle" font-weight="700">2</text><path d="M730,315 L830,315" fill="none" stroke="#C9BCA9" stroke-width="4" marker-end="url(#a)"/><rect x="860" y="244" width="420" height="142" rx="18" fill="#FFFFFF" stroke="#E9B44C" stroke-width="3"/><text x="1070.0" y="313.0" font-family="'SF Mono',Menlo,Consolas" font-size="26" font-weight="700" fill="#2B2320" text-anchor="middle">LongRunningFunctionTool</text><text x="1070.0" y="341.0" font-family="-apple-system,'SF Pro Text','Helvetica Neue',Arial" font-size="17" fill="#8B7E70" text-anchor="middle">wrapping thumb_submit(idea)</text><circle cx="980" cy="480" r="26" fill="#2B2320"/><text x="980" y="489" font-family="'SF Mono',Menlo,Consolas" font-size="24" fill="#FFFFFF" text-anchor="middle" font-weight="700">3</text><path d="M1070,386 L1070,470 L1180,530" fill="none" stroke="#6E9A68" stroke-width="4" marker-end="url(#aS)"/><rect x="1190" y="486" width="330" height="100" rx="18" fill="#EFF4EC" stroke="#6E9A68" stroke-width="3"/><text x="1355.0" y="534.0" font-family="'SF Mono',Menlo,Consolas" font-size="26" font-weight="700" fill="#2B2320" text-anchor="middle">the thumbnail studio</text><text x="1355.0" y="562.0" font-family="-apple-system,'SF Pro Text','Helvetica Neue',Arial" font-size="17" fill="#8B7E70" text-anchor="middle">a real image model, ~20-30s</text><path d="M1000,386 L1000,470 L560,545" fill="none" stroke="#C96442" stroke-width="4" marker-end="url(#aT)"/><rect x="300" y="500" width="260" height="92" rx="18" fill="#FDF3EC" stroke="#C96442" stroke-width="3"/><text x="430.0" y="544.0" font-family="'SF Mono',Menlo,Consolas" font-size="26" font-weight="700" fill="#2B2320" text-anchor="middle">receipt</text><text x="430.0" y="572.0" font-family="-apple-system,'SF Pro Text','Helvetica Neue',Arial" font-size="17" fill="#8B7E70" text-anchor="middle">{status: pending, job_id}</text><circle cx="240" cy="545" r="26" fill="#C96442"/><text x="240" y="554" font-family="'SF Mono',Menlo,Consolas" font-size="24" fill="#FFFFFF" text-anchor="middle" font-weight="700">4</text><path d="M300,545 L200,545 L200,640 L300,640" fill="none" stroke="#C96442" stroke-width="4" marker-end="url(#aT)"/><rect x="306" y="600" width="420" height="84" rx="18" fill="#FFFFFF" stroke="#C96442" stroke-width="3"/><text x="516.0" y="640.0" font-family="'SF Mono',Menlo,Consolas" font-size="26" font-weight="700" fill="#2B2320" text-anchor="middle">WAITING · turn over</text><text x="516.0" y="668.0" font-family="-apple-system,'SF Pro Text','Helvetica Neue',Arial" font-size="17" fill="#8B7E70" text-anchor="middle">the wait is now a row in sessions.db</text><text x="1080" y="660" font-family="-apple-system,'SF Pro Text','Helvetica Neue',Arial" font-size="22" fill="#2B2320" text-anchor="middle" font-weight="700">no blocking · no thread · no callback</text></svg>